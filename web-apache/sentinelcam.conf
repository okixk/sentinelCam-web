# Apache vhost inside the sentinelCam web container.
#
# Apache listens on plain HTTP :80 (TLS is terminated upstream in Traefik).
# It serves /static/* directly from the filesystem and reverse-proxies
# everything else to uvicorn on 127.0.0.1:3000. WebSocket upgrade paths
# get their own ProxyPass entries — bare RewriteRule [P,L] does not grant
# proxy access and ends up returning 403 from Apache itself.

# Global hardening directives — must live outside <VirtualHost>.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    ServerName sentinelcam.local
    ServerAdmin admin@sentinelcam.local
    DocumentRoot /app

    # Strip client-supplied X-Forwarded-Host so it can never reach the app.
    # The app pins WebAuthn origin / secure-cookie / CSRF to the configured
    # canonical origin (SC_PUBLIC_ORIGIN / WEBAUTHN_RP_ID); this is defense in
    # depth so even the dev fallback path cannot be spoofed via a forged header.
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Forwarded-For-Apache

    # --- /static/ served directly --------------------------------------------
    Alias /static/ /app/static/
    <Directory /app/static/>
        Require all granted
        Options -Indexes
        AllowOverride None
        ExpiresActive On
        ExpiresDefault "access plus 1 hour"
    </Directory>

    # --- Reverse-proxy everything else to uvicorn ----------------------------
    ProxyRequests Off
    ProxyPreserveHost On
    # Long-running MJPEG / SSE / WebSocket streams must not be torn down.
    ProxyTimeout 3600
    Timeout 3600
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 0

    # WebSocket upgrade endpoints (must come before the catch-all ProxyPass).
    ProxyPass        /api/ingest/        ws://127.0.0.1:3000/api/ingest/
    ProxyPassReverse /api/ingest/        ws://127.0.0.1:3000/api/ingest/
    ProxyPass        /api/worker/connect ws://127.0.0.1:3000/api/worker/connect
    ProxyPassReverse /api/worker/connect ws://127.0.0.1:3000/api/worker/connect

    # Do not proxy /static/ — Alias above handles it.
    ProxyPass        /static/ !
    ProxyPass        / http://127.0.0.1:3000/ retry=0 disablereuse=on
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
