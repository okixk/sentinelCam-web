; Supervisor program definitions for the sentinelCam web container.
;
; Two processes share the container: Apache (front, port 80) and uvicorn
; (back, 127.0.0.1:3000). If either dies, supervisord restarts it; if both
; exit cleanly, supervisord stays up because the base config is daemonless
; (started with `-n` from the Dockerfile CMD).

[program:uvicorn]
command=/usr/local/bin/python /app/run_web.py
directory=/app
user=sentinelcam
environment=HOME="/home/sentinelcam",USER="sentinelcam"
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:apache]
command=/usr/sbin/apachectl -DFOREGROUND
autostart=true
autorestart=true
; Give uvicorn a head start so Apache's first health probe gets a real
; backend; without this Apache can briefly serve 502s on cold boot.
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
