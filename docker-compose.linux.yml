#
# Legacy Linux override for workers that only listen on 127.0.0.1.
# Prefer the default docker-compose.yml and start the worker with --host 0.0.0.0
# so the web container can reach it via host.docker.internal.
#
services:
  web:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      WORKER_BASE_URL: ${WORKER_BASE_URL:-http://127.0.0.1:8080}
