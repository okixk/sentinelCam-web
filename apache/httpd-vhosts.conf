# sentinelCam Apache vhost config.
#
# Apache fronts the FastAPI web container on the internal Docker network.
# Plain HTTP gets a 301 to HTTPS; HTTPS terminates TLS and reverse-proxies
# to web:3000.

ServerName ${SC_PUBLIC_HOSTNAME}
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The base image already listens on 80; enable 443 for TLS.
Listen 443

<VirtualHost *:80>
    ServerName ${SC_PUBLIC_HOSTNAME}
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${SC_PUBLIC_HOSTNAME}

    SSLEngine on
    SSLCertificateFile /etc/apache/certs/server.crt
    SSLCertificateKeyFile /etc/apache/certs/server.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!RC4

    # Pass scheme + host through so uvicorn's proxy_headers reconstructs the
    # browser-visible URL (used by WebAuthn origin verification, secure
    # cookies, and the CSRF same-origin check).
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    ProxyRequests Off
    ProxyPreserveHost On
    # Long-running MJPEG / SSE streams must not be torn down by the proxy.
    ProxyTimeout 3600
    Timeout 3600
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 0

    ProxyPass        / http://web:3000/ retry=0 disablereuse=on
    ProxyPassReverse / http://web:3000/
</VirtualHost>
