# Apache reverse-proxy config for both sites on the same host.
#
#   sentinelcam.ch  -> web:3000        (FastAPI app)
#   studygames.ch   -> probe-va:80     (PHP/Apache static-ish site)
#
# Plain HTTP on :80 redirects to HTTPS. TLS terminates here and reverse-proxies
# to the matching internal container. If the probe-va container is down, the
# studygames vhost returns 502 but the sentinelcam vhost is unaffected
# (mod_proxy resolves backend DNS lazily, per request).

ServerName ${SC_PUBLIC_HOSTNAME}
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The base image already listens on 80; enable 443 for TLS.
Listen 443

<VirtualHost *:80>
    ServerName ${SC_PUBLIC_HOSTNAME}
    ServerAlias ${SC_ALT_HOSTNAME}
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

# --- sentinelcam.ch -> FastAPI web container ---------------------------------
<VirtualHost *:443>
    ServerName ${SC_PUBLIC_HOSTNAME}

    SSLEngine on
    SSLCertificateFile /etc/apache/certs/server.crt
    SSLCertificateKeyFile /etc/apache/certs/server.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!RC4

    # Pass scheme + host through so uvicorn's proxy_headers reconstructs the
    # browser-visible URL (used by WebAuthn origin verification, secure
    # cookies, and the CSRF same-origin check).
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    ProxyRequests Off
    ProxyPreserveHost On
    # Long-running MJPEG / SSE / WebSocket streams must not be torn down by
    # the proxy. Keep all relevant timeouts wide.
    ProxyTimeout 3600
    Timeout 3600
    SetEnv proxy-sendchunked 1
    SetEnv proxy-nokeepalive 0

    # Pi camera ingest WebSocket. The {var}s here is a regex backref via
    # RewriteCond/RewriteRule so each camera id is mapped to the upstream.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade}    =websocket [NC]
    RewriteCond %{HTTP:Connection} =upgrade   [NC]
    RewriteRule ^/api/ingest/(.*)         ws://web:3000/api/ingest/$1            [P,L]
    RewriteCond %{HTTP:Upgrade}    =websocket [NC]
    RewriteCond %{HTTP:Connection} =upgrade   [NC]
    RewriteRule ^/api/worker/connect      ws://web:3000/api/worker/connect       [P,L]

    ProxyPass        / http://web:3000/ retry=0 disablereuse=on
    ProxyPassReverse / http://web:3000/
</VirtualHost>

# --- studygames.ch -> Probe-VA PHP container ---------------------------------
# Stays in the config even when probe-va is offline; mod_proxy will just emit
# 502 for studygames.ch in that case.
<VirtualHost *:443>
    ServerName ${SC_ALT_HOSTNAME}

    SSLEngine on
    SSLCertificateFile /etc/apache/certs/server.crt
    SSLCertificateKeyFile /etc/apache/certs/server.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES:!RC4

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    Timeout 60

    ProxyPass        / http://probe-va:80/ retry=0 disablereuse=on
    ProxyPassReverse / http://probe-va:80/
</VirtualHost>
