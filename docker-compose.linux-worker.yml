# Optional Linux worker container.
# Use together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.linux-worker.yml up -d --build
#
# The worker runs on the host network and listens on 0.0.0.0 by default,
# so the web container can reach it at http://host.docker.internal:8080.

services:
  web:
    depends_on:
      worker:
        condition: service_healthy

  worker:
    build:
      context: ../sentinelCam-worker
    network_mode: host
    environment:
      WEB_AUTH_TOKEN: ${WORKER_TOKEN:-}
      WEB_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command:
      - "--host"
      - "${WORKER_BIND_HOST:-0.0.0.0}"
      - "--port"
      - "8080"
      - "--source"
      - "${WORKER_SOURCE:-0}"
      - "--no-window"
      - "--stream"
      - "auto"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
