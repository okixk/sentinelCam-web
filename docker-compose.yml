# Single compose file for the full Linux stack.
# Run everything with:
#   docker compose up -d --build
#
# On Windows/macOS, the worker usually still runs locally.
# In that case, start only the web service:
#   docker compose up -d --build web

services:
  web:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      WORKER_BASE_URL: ${WORKER_BASE_URL:-http://host.docker.internal:8080}
      WORKER_TOKEN: ${WORKER_TOKEN}
      WEB_PORT: ${WEB_PORT:-3000}
      SC_PUBLIC: ${SC_PUBLIC:-1}
      INITIAL_ADMIN_USER: ${ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
    volumes:
      - web-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../sentinelCam-worker
    network_mode: host
    environment:
      WEB_AUTH_TOKEN: ${WORKER_TOKEN:-}
      WEB_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      YOLO_CONFIG_DIR: /app/.runtime/ultralytics_config
      SC_WEIGHTS_DIR: /app/.runtime/weights
      SC_RUNS_DIR: /app/.runtime/runs
      SC_DATASETS_DIR: /app/.runtime/datasets
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      DEFAULT_CONTEXT_ENABLED: ${DEFAULT_CONTEXT_ENABLED:-0}
      DEFAULT_CONTEXT_SETUP_OLLAMA: ${DEFAULT_CONTEXT_SETUP_OLLAMA:-0}
      DEFAULT_CONTEXT_PROFILE: ${DEFAULT_CONTEXT_PROFILE:-auto}
      DEFAULT_CONTEXT_MODEL: ${DEFAULT_CONTEXT_MODEL:-auto}
    volumes:
      - ../sentinelCam-worker/.runtime:/app/.runtime
    command:
      - "--host"
      - "${WORKER_BIND_HOST:-0.0.0.0}"
      - "--port"
      - "8080"
      - "--source"
      - "${WORKER_SOURCE:-0}"
      - "--device"
      - "${WORKER_DEVICE:-auto}"
      - "--no-window"
      - "--stream"
      - "${WORKER_STREAM_MODE:-auto}"
      - "--use-pose"
      - "--max-fps"
      - "${WORKER_MAX_FPS:-120}"
      - "--performance-profile"
      - "${WORKER_PERFORMANCE_PROFILE:-auto}"
      - "--stream-quality"
      - "${WORKER_STREAM_QUALITY:-auto}"
      - "--jpeg-quality"
      - "${WORKER_JPEG_QUALITY:-88}"
      - "--webrtc-codec"
      - "${WORKER_WEBRTC_CODEC:-auto}"
      - "--webrtc-bitrate"
      - "${WORKER_WEBRTC_BITRATE:--1}"
      - "--webrtc-fps"
      - "${WORKER_WEBRTC_FPS:-0}"
      - "--camera-fps"
      - "${WORKER_CAMERA_FPS:-0}"
    devices:
      - "${WORKER_VIDEO_DEVICE:-/dev/video0}:${WORKER_VIDEO_DEVICE:-/dev/video0}"
    group_add:
      - video
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  web-data:
