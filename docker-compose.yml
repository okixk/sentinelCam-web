# Full sentinelCam stack: Traefik edge router + web app (Apache+FastAPI) +
# database + local storage + WireGuard VPN.
#
# Bring everything up:
#   docker network create proxy-net      # one-time, shared with Probe-VA
#   # Drop Cloudflare Origin Certs into ./certs/ (see certs/README.md), and
#   # create a .env that defines POSTGRES_PASSWORD, ADMIN_PASSWORD, WG_HOST,
#   # WG_PASSWORD_HASH (see README for details), then:
#   docker compose up -d --build
#
# Externally only three ports are exposed:
#   - 80/tcp  : Traefik HTTP -> 301 to HTTPS
#   - 443/tcp : Traefik HTTPS, routes by Host header:
#               sentinelcam.ch -> web container (Apache in front of FastAPI)
#               aarestadt.info -> probe-va container (separate compose stack)
#   - 1194/udp: WireGuard VPN (configurable via WG_PORT)
#
# Postgres, the FastAPI web container, the Traefik dashboard and the
# wg-easy admin UI live on the internal `sentinelcam` network. Traefik
# additionally joins the shared `proxy-net` network so it can reach the
# separately-managed Probe-VA stack (see /home/administrator/Probe-VA/
# docker-compose.yml). The two stacks start and stop independently —
# sentinelcam.ch keeps working when probe-va is down (the aarestadt
# Traefik router just returns 502). Both the Traefik dashboard and the
# wg-easy admin UI are bound to host loopback only — reach them via SSH
# tunnel for the initial setup, or via the VPN once a client is
# configured.

name: sentinelcam

networks:
  # Internal network for the sentinelCam stack itself (postgres, web,
  # wg-easy, traefik). Subnet is pinned so the Traefik dashboard is
  # reachable from inside the WireGuard tunnel at a stable IP — the
  # wg-easy container masquerades VPN client traffic onto this bridge.
  sentinelcam:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Shared edge network used by Traefik to reach backends from both this
  # stack (web) and the separately-managed Probe-VA stack. Declared external
  # so the two stacks can be started and stopped independently.
  # Create it once on the host with:  docker network create proxy-net
  proxy-net:
    external: true
    name: proxy-net

volumes:
  postgres-data:
  recordings-data:
  wireguard-data:

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --configfile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      # Dashboard, bound to host loopback only (reach via SSH tunnel or VPN).
      - "127.0.0.1:8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs:ro
    networks:
      sentinelcam:
        # Fixed bridge IP so VPN clients can browse the dashboard at
        # http://172.30.0.10:8080/dashboard/ (the wg-easy container
        # masquerades traffic onto this bridge — see network comment).
        ipv4_address: 172.30.0.10
      proxy-net: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelcam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelcam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [sentinelcam]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
      SC_PUBLIC: ${SC_PUBLIC:-1}
      # Apache inside the container forwards from 127.0.0.1; Traefik adds
      # X-Forwarded-* upstream of Apache. Trust both.
      SC_FORWARDED_ALLOW_IPS: "127.0.0.1"
      INITIAL_ADMIN_USER: ${ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinelcam}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelcam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/recordings}
    volumes:
      - recordings-data:${LOCAL_STORAGE_PATH:-/data/recordings}
    # The web container needs to be reachable from Traefik (proxy-net) and
    # also reach Postgres on the internal network (sentinelcam).
    networks: [sentinelcam, proxy-net]
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  wg-easy:
    # WireGuard VPN. Default port is 1194/udp (the same number OpenVPN
    # traditionally uses); the protocol on the wire is WireGuard, so VPN
    # clients must run a WireGuard client, not an OpenVPN client.
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST:?WG_HOST must be set in .env (DNS name or public IP of this server)}
      PASSWORD_HASH: ${WG_PASSWORD_HASH:?WG_PASSWORD_HASH must be set in .env (see README)}
      WG_PORT: ${WG_PORT:-1194}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-1.1.1.1}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0, ::/0}
      WG_PERSISTENT_KEEPALIVE: ${WG_PERSISTENT_KEEPALIVE:-25}
      UI_TRAFFIC_STATS: "true"
    volumes:
      - wireguard-data:/etc/wireguard
    ports:
      # The one VPN port reachable from the public network. wg-easy v14
      # listens on WG_PORT *inside* the container (the legacy fixed 51820
      # is gone in v14), so host and container port must match.
      - "${WG_PORT:-1194}:${WG_PORT:-1194}/udp"
      # Admin UI bound to host loopback only. Reach it from your laptop via
      #   ssh -L 51821:127.0.0.1:51821 <user>@<server>
      # for the initial config, or from inside an already-connected VPN
      # session by routing to the WireGuard server IP.
      - "127.0.0.1:51821:51821"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    networks:
      sentinelcam:
        # Fixed bridge IP so VPN clients can also reach the admin UI at
        # http://172.30.0.20:51821 in addition to the tunnel-internal
        # http://10.8.0.1:51821.
        ipv4_address: 172.30.0.20
