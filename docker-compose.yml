# Full sentinelCam stack: web app + Apache reverse proxy + database + local
# storage + WireGuard VPN.
#
# Bring everything up:
#   # create a .env that defines POSTGRES_PASSWORD, ADMIN_PASSWORD, WG_HOST,
#   # WG_PASSWORD_HASH (see README for details), then:
#   docker compose up -d --build
#
# Externally only three ports are exposed:
#   - 80/tcp  : Apache HTTP -> 301 to HTTPS
#   - 443/tcp : Apache HTTPS (reverse-proxies the web container)
#   - 1194/udp: WireGuard VPN (configurable via WG_PORT)
# Everything else (postgres, the FastAPI web container, the wg-easy admin UI)
# lives on the internal `sentinelcam` network. The wg-easy admin console is
# bound to host loopback only — you reach it via SSH tunnel for the initial
# setup, then via the VPN once a client is configured.

name: sentinelcam

networks:
  sentinelcam:
    driver: bridge

volumes:
  postgres-data:
  recordings-data:
  apache-certs:
  wireguard-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelcam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelcam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [sentinelcam]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
      SC_PUBLIC: ${SC_PUBLIC:-1}
      SC_FORWARDED_ALLOW_IPS: "*"
      INITIAL_ADMIN_USER: ${ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinelcam}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelcam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/recordings}
    volumes:
      - recordings-data:${LOCAL_STORAGE_PATH:-/data/recordings}
    networks: [sentinelcam]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  apache:
    build:
      context: ./apache
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SC_PUBLIC_HOSTNAME: ${SC_PUBLIC_HOSTNAME:-sentinelcam.local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Self-signed certificate is generated on first start by the entrypoint.
      # Drop a real cert (server.crt / server.key) into this volume to override.
      - apache-certs:/etc/apache/certs
    networks: [sentinelcam]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  wg-easy:
    # WireGuard VPN. Default port is 1194/udp (the same number OpenVPN
    # traditionally uses); the protocol on the wire is WireGuard, so VPN
    # clients must run a WireGuard client, not an OpenVPN client.
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST:?WG_HOST must be set in .env (DNS name or public IP of this server)}
      PASSWORD_HASH: ${WG_PASSWORD_HASH:?WG_PASSWORD_HASH must be set in .env (see README)}
      WG_PORT: ${WG_PORT:-1194}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-1.1.1.1}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0, ::/0}
      WG_PERSISTENT_KEEPALIVE: ${WG_PERSISTENT_KEEPALIVE:-25}
      UI_TRAFFIC_STATS: "true"
    volumes:
      - wireguard-data:/etc/wireguard
    ports:
      # The one VPN port reachable from the public network.
      - "${WG_PORT:-1194}:51820/udp"
      # Admin UI bound to host loopback only. Reach it from your laptop via
      #   ssh -L 51821:127.0.0.1:51821 <user>@<server>
      # for the initial config, or from inside an already-connected VPN
      # session by routing to the WireGuard server IP.
      - "127.0.0.1:51821:51821"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    networks: [sentinelcam]
