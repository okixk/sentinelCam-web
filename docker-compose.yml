# Full sentinelCam stack: web app + reverse proxy + database + local storage + VPN.
#
# Bring everything up:
#   cp .env.example .env   # fill in the secrets first
#   docker compose up -d --build
#
# Only Caddy and the VPN need host ports. Everything else lives on the
# internal `sentinelcam` network. The wg-easy admin console is bound to
# loopback so it's reachable from the host but not the public internet until
# you choose to expose it.

name: sentinelcam

networks:
  sentinelcam:
    driver: bridge

volumes:
  postgres-data:
  recordings-data:
  caddy-data:
  caddy-config:
  wireguard-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelcam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelcam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [sentinelcam]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
      SC_PUBLIC: ${SC_PUBLIC:-1}
      SC_FORWARDED_ALLOW_IPS: "*"
      INITIAL_ADMIN_USER: ${ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sentinelcam}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelcam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/recordings}
    volumes:
      - recordings-data:${LOCAL_STORAGE_PATH:-/data/recordings}
    networks: [sentinelcam]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SC_PUBLIC_HOSTNAME: ${SC_PUBLIC_HOSTNAME:-sentinelcam.local}
      SC_TLS_EMAIL: ${SC_TLS_EMAIL:-internal}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [sentinelcam]

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST:-localhost}
      PASSWORD_HASH: ${WG_PASSWORD_HASH:?WG_PASSWORD_HASH must be set in .env (see README)}
      WG_PORT: ${WG_PORT:-51820}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-1.1.1.1}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0, ::/0}
      WG_PERSISTENT_KEEPALIVE: ${WG_PERSISTENT_KEEPALIVE:-25}
      UI_TRAFFIC_STATS: "true"
    volumes:
      - wireguard-data:/etc/wireguard
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      # Admin UI on loopback. SSH tunnel or VPN to reach it.
      - "127.0.0.1:51821:51821"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    networks: [sentinelcam]
