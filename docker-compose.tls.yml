# Overlay that puts Caddy in front of the web container for TLS termination.
#
# Usage:
#   cp .env.example .env  # set SC_PUBLIC_HOSTNAME + SC_TLS_EMAIL if you have
#                         # a public DNS name + cert email
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# What this overlay changes vs the bare compose:
#   - web no longer publishes port 80/3000 to the host; the only ingress is
#     Caddy on the internal docker network.
#   - Caddy publishes 80 and 443 with automatic HTTPS (Let's Encrypt when
#     SC_PUBLIC_HOSTNAME points to a real DNS name, "tls internal" otherwise).
#   - SC_FORWARDED_ALLOW_IPS="*" tells uvicorn to honor X-Forwarded-* from any
#     peer; this is safe here because the only peer reaching the web service
#     is Caddy on the docker network, not arbitrary internet clients.

services:
  web:
    ports: !reset []
    expose:
      - "3000"
    environment:
      SC_FORWARDED_ALLOW_IPS: "*"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SC_PUBLIC_HOSTNAME: ${SC_PUBLIC_HOSTNAME:-sentinelcam.local}
      SC_TLS_EMAIL: ${SC_TLS_EMAIL:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  caddy-data:
  caddy-config:
