# Webcam passthrough override for Linux.
# Use together with the base and linux compose files:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml -f docker-compose.linux-cam.yml up -d --build
#
# Set WORKER_VIDEO_DEVICE to the camera device path (default: /dev/video0).

services:
  worker:
    devices:
      - "${WORKER_VIDEO_DEVICE:-/dev/video0}:${WORKER_VIDEO_DEVICE:-/dev/video0}"
