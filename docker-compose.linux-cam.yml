# Webcam passthrough override for the optional Linux worker container.
# Use together with the base, linux, and linux-worker compose files:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml -f docker-compose.linux-worker.yml -f docker-compose.linux-cam.yml up -d --build
#
# Set WORKER_VIDEO_DEVICE to the camera device path (default: /dev/video0).

services:
  worker:
    devices:
      - "${WORKER_VIDEO_DEVICE:-/dev/video0}:${WORKER_VIDEO_DEVICE:-/dev/video0}"
    group_add:
      - video
