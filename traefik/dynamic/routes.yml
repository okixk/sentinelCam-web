# Static routing definitions. Hostname references (web, probe-va) are
# resolved by docker network DNS on the proxy-net network — both backend
# containers must be attached to that network for this to work.
#
# Update SC_PUBLIC_HOSTNAME / SC_ALT_HOSTNAME here if you change them in
# .env. The values are not interpolated from environment variables when
# Traefik reads this file.

http:
  routers:
    # Direct (non-Cloudflare) access to the web app:
    #  - `ie-lis050`      : the web server's internal hostname, for the worker /
    #                       LAN clients that resolve it via your network DNS.
    #  - `172.30.0.10`    : the Traefik bridge IP that WireGuard VPN clients can
    #                       reach (the edge can dial wss://172.30.0.10 directly,
    #                       no hosts file / no reachable internal DNS needed).
    # Host() does not match IP literals, so the bridge IP is matched via
    # HostRegexp (Traefik v3 Go-regexp syntax). Traefik hot-reloads this file.
    sentinelcam:
      rule: 'Host(`sentinelcam.ch`) || Host(`ie-lis050`) || HostRegexp(`^172\.30\.0\.10$`)'
      entryPoints: [websecure]
      service: sentinelcam
      tls: {}

    aarestadt:
      rule: "Host(`aarestadt.info`)"
      entryPoints: [websecure]
      service: aarestadt
      tls: {}

  services:
    sentinelcam:
      loadBalancer:
        servers:
          - url: "http://web:80"
        passHostHeader: true

    aarestadt:
      loadBalancer:
        servers:
          - url: "http://probe-va:80"
        passHostHeader: true
