{% extends "base.html" %}
{% block title %}Admin – sentinelCam{% endblock %}
{% block content %}
<div class="page">
  <section class="page-hero">
    <div class="page-title-group">
      <h1>Admin</h1>
    </div>
  </section>

  <div class="admin-grid">
    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Users</h2>
        </div>
      </div>
      <div id="users-table" class="loading-state">Loading...</div>
      <hr>
      <h3>Create user</h3>
      <form id="create-user-form">
        <div class="field"><label>Username</label><input id="new-username" autocomplete="username" required /></div>
        <div class="field"><label>Password (min 12 chars)</label><input id="new-password" type="password" autocomplete="new-password" required /></div>
        <div class="field">
          <label>Role</label>
          <select id="new-role">
            <option value="viewer">Viewer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit">Create User</button>
      </form>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Active sessions</h2>
        </div>
      </div>
      <div id="sessions-table" class="loading-state">Loading...</div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Passkeys</h2>
        </div>
      </div>
      <div id="passkeys-list" class="loading-state">Loading...</div>
      <button id="register-passkey-btn" class="secondary" style="margin-top:12px;">Register new passkey</button>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Stack</h2>
        </div>
      </div>
      <div id="system-info" class="stack-notes loading-state">Loading...</div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Operations</h2>
        </div>
      </div>
      <div id="ops-status" class="stack-notes loading-state">Loading...</div>
    </div>
  </div>
</div>
<div id="password-reset-modal" class="modal-backdrop" hidden aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="password-reset-title">
    <div class="modal-head">
      <div>
        <h2 id="password-reset-title">Reset password</h2>
        <p class="modal-subtitle"><strong id="password-reset-username"></strong></p>
      </div>
      <button type="button" class="ghost modal-close" data-action="cancel-password-reset">Close</button>
    </div>
    <form id="password-reset-form">
      <input id="password-reset-username-input" type="text" autocomplete="username" tabindex="-1" hidden />
      <div class="field">
        <label for="password-reset-password">New password</label>
        <input id="password-reset-password" type="password" autocomplete="new-password" minlength="12" required />
      </div>
      <div class="field">
        <label for="password-reset-confirm">Confirm new password</label>
        <input id="password-reset-confirm" type="password" autocomplete="new-password" minlength="12" required />
      </div>
      <p id="password-reset-feedback" class="modal-feedback small" aria-live="polite"></p>
      <div class="row modal-actions">
        <button type="button" class="secondary" data-action="cancel-password-reset">Cancel</button>
        <button type="submit" id="password-reset-submit">Update password</button>
      </div>
    </form>
  </div>
</div>
<script nonce="{{ request.state.csp_nonce }}" src="/static/js/passkeys.js?v=20260519a"></script>
<script nonce="{{ request.state.csp_nonce }}" src="/static/js/admin.js?v=20260519a"></script>
{% endblock %}
