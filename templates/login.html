{% extends "base.html" %}
{% block title %}Login - sentinelCam{% endblock %}
{% block content %}
<div class="login-layout login-layout-compact">
  <a href="/auth/login" class="nav-brand login-site-brand" aria-label="sentinelCam login">
    <span class="nav-brand-mark" aria-hidden="true">
      <img src="/static/branding/favicon.png?v=20260602a" alt="" class="nav-brand-logo" width="32" height="32" />
    </span>
    <span class="login-site-brand-copy">
      <strong class="nav-brand-title">sentinelCam</strong>
      <span class="nav-brand-subtitle">Control surface</span>
    </span>
  </a>
  <section class="panel login-panel login-panel-compact">
    <div class="login-hero-mark" aria-hidden="true">
      <img src="/static/branding/sentinelCam.png?v=20260602a" alt="" class="login-hero-logo" width="96" height="96" />
    </div>
    <span class="eyebrow">Secure access</span>
    <h1>Welcome back</h1>
    <p class="panel-intro">Sign in with your password or a passkey.</p>
    <div id="error-msg" class="error-msg" style="display:none"></div>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required />
      </div>
      <div class="form-actions">
        <button type="submit" id="login-btn">Login</button>
      </div>
    </form>
    <div id="webauthn-section" style="display:none">
      <div class="auth-divider"><span>or</span></div>
      <button type="button" id="passkey-btn" class="secondary">Sign in with passkey</button>
    </div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}" src="/static/js/auth.js?v=20260320b"></script>
{% endblock %}
